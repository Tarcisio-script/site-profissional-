<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="fundo-borrado"></div>
    <div class="conteudo">
        <div class="login-conteiner">
            <div class="h1-login">
                <h1>Login</h1>
            </div>

            <label for="nome">Nome de usuário:</label>
            <input type="text" id="nome" placeholder="Choco">

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="choco@gmail.com">

            <label for="Senha">Senha:</label>
            <input type="number" id="senha" placeholder="4002-8922">
<button type="button" class="bnt" id="confirmar">Confirmar login </button>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
